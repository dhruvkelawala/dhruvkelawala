<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5A36"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="32" />
    </filter>
  </defs>

  <rect width="1200" height="240" fill="#0b0d10"/>

  <!-- soft gradient blobs -->
  <circle cx="220" cy="70" r="140" fill="url(#g)" opacity="0.35" filter="url(#blur)"/>
  <circle cx="980" cy="190" r="180" fill="url(#g)" opacity="0.25" filter="url(#blur)"/>

  <!-- text -->
  <text x="72" y="110" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="46" font-weight="800">
    Dhruv Kelawala
  </text>
  <text x="72" y="154" fill="#d1d5db" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="20" font-weight="500">
    Web3 × AI — building agent-native products, Starknet tooling, and shipped code
  </text>

  <!-- tags -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="14" font-weight="700">
    <rect x="72" y="176" rx="12" ry="12" width="112" height="28" fill="#111827" stroke="#374151"/>
    <text x="92" y="195" fill="#ffffff">TypeScript</text>

    <rect x="194" y="176" rx="12" ry="12" width="70" height="28" fill="#111827" stroke="#374151"/>
    <text x="214" y="195" fill="#ffffff">React</text>

    <rect x="274" y="176" rx="12" ry="12" width="86" height="28" fill="#111827" stroke="#374151"/>
    <text x="294" y="195" fill="#ffffff">Starknet</text>

    <rect x="370" y="176" rx="12" ry="12" width="64" height="28" fill="#111827" stroke="#374151"/>
    <text x="390" y="195" fill="#ffffff">Cairo</text>

    <rect x="444" y="176" rx="12" ry="12" width="48" height="28" fill="#111827" stroke="#374151"/>
    <text x="460" y="195" fill="#ffffff">Zig</text>
  </g>
</svg>
